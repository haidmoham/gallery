<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#d5d0c6" />
    <meta name="description" content="A spatial gallery of Yusuke Nakamura's artwork." />
    <title>nakamura gallery</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <main id="gallery" aria-label="Yusuke Nakamura art gallery">
      <div class="architecture" aria-hidden="true"><div class="wall-light"></div><div class="wall-line"></div><div class="floor"></div></div>
      <header class="toolbar">
        <a class="artist-brand" href="https://yusuke-nakamura.stores.jp/" target="_blank" rel="noopener noreferrer" aria-label="Yusuke Nakamura — official shop"><span>Yusuke<br>Nakamura</span><span aria-hidden="true">↗</span></a>
        <div class="mode-switch" role="group" aria-label="Presentation mode">
          <button aria-label="Framed gallery" aria-pressed="true" data-action="museum"><svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx=".5"/><rect x="7" y="6" width="10" height="12"/></svg></button>
          <button aria-label="Immersive view" aria-pressed="false" data-action="immersive"><svg viewBox="0 0 24 24"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5M9 9h6v6H9z"/></svg></button>
        </div>
        <div class="view-controls"><button class="zoom-button" aria-label="Zoom out" data-action="zoom-out"><svg viewBox="0 0 24 24"><circle cx="10" cy="10" r="6"/><path d="m15 15 5 5M7 10h6"/></svg></button><button class="zoom-button" aria-label="Zoom in" data-action="zoom-in"><svg viewBox="0 0 24 24"><circle cx="10" cy="10" r="6"/><path d="m15 15 5 5M7 10h6m-3-3v6"/></svg></button><button class="motion-button" aria-label="Pause motion" aria-pressed="false" data-action="motion"><svg viewBox="0 0 24 24" class="pause-icon"><path d="M9 5v14M15 5v14"/></svg><svg viewBox="0 0 24 24" class="play-icon"><path d="m8 5 11 7-11 7z"/></svg></button></div>
      </header>
      <section class="room" aria-label="Selected artwork">
        <canvas id="spatial-gallery" aria-hidden="true"></canvas>
        <div class="peripheral peripheral-left" aria-hidden="true"><div class="side-frame"><img alt="" /></div></div>
        <div class="peripheral peripheral-right" aria-hidden="true"><div class="side-frame"><img alt="" /></div></div>
        <div class="frame-position">
          <div class="art-aura" aria-hidden="true"></div>
          <div class="frame" tabindex="0" role="button" aria-label="Open immersive view of artwork">
            <div class="frame-bevel"><div class="mat"><div class="print">
              <img id="artwork" alt="" fetchpriority="high" />
              <div class="paper" aria-hidden="true"></div>
            </div></div></div>
            <div class="glass" aria-hidden="true"></div>
          </div>
          <div class="frame-shadow" aria-hidden="true"></div>
        </div>
        <button class="arrow arrow-left" aria-label="Previous artwork" data-action="prev"><svg viewBox="0 0 24 24"><path d="m14 5-7 7 7 7"/></svg></button>
        <button class="arrow arrow-right" aria-label="Next artwork" data-action="next"><svg viewBox="0 0 24 24"><path d="m10 5 7 7-7 7"/></svg></button>
      </section>
      <div id="frame-credits" aria-label="Artwork credits"></div>
      <footer class="collection-bar"><button class="quiet-button" aria-label="Browse all artworks" data-action="overview"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="6" height="7"/><rect x="15" y="3" width="6" height="7"/><rect x="3" y="14" width="6" height="7"/><rect x="15" y="14" width="6" height="7"/></svg></button><button class="quiet-button" aria-label="View original artwork without effects" aria-pressed="false" data-action="original"><svg viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></button><nav id="collection" aria-label="Choose artwork"></nav><button class="quiet-button" aria-label="Reset camera and zoom" data-action="reset-view"><svg viewBox="0 0 24 24"><path d="M4 10a8 8 0 1 1 0 5M4 4v6h6"/></svg></button><button class="quiet-button" aria-label="Artwork sources and credits" data-action="info"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6m0-10v1"/></svg></button></footer>
      <div class="fan-notice">Illustration by <a href="https://yusuke-nakamura.stores.jp/" target="_blank" rel="noopener noreferrer">Yusuke Nakamura ↗</a><span> · </span><button data-action="info">Non-commercial fan gallery · Unaffiliated</button></div>
      <div class="loading-dot" role="status" aria-label="Loading artwork"></div>
      <div class="error-message" role="alert" hidden>Artwork could not load. <button data-action="reload">Try again</button></div>
    </main>
    <dialog id="information"><button class="close-info" aria-label="Close information" data-action="close-info">×</button><div id="info-content"></div></dialog>
    <dialog id="overview" aria-labelledby="overview-title"><button class="close-info" aria-label="Close artwork overview" data-action="close-overview">×</button><h1 id="overview-title">Yusuke Nakamura</h1><p>Illustrations by <a href="https://yusuke-nakamura.stores.jp/" target="_blank" rel="noopener noreferrer">Yusuke Nakamura ↗</a> · Independent, non-commercial fan selection.</p><div id="overview-grid"></div></dialog>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
